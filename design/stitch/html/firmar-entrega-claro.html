  </head><body class="bg-background font-body-md text-on-background min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-screen flex items-center gap-4"><button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-surface-container"><span class="material-symbols-outlined text-on-surface">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface truncate">Firmar Entrega</h1></div></header><main class="pt-16 pb-12 px-margin-screen bg-background"><div class="flex flex-col w-full h-full pb-safe">
<div class="flex flex-col gap-gutter-stack">
<!-- Header Info -->
<div class="bg-surface-container rounded-xl p-padding-card">
<h2 class="font-headline-md text-headline-md text-on-surface">Confirmar Entrega</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Por favor, ingrese los datos de quien recibe la carga.</p>
</div>
<!-- Receiver Info -->
<div class="flex flex-col gap-4 bg-surface-container rounded-xl p-padding-card">
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="receiver-name">Nombre del receptor</label>
<input class="min-h-[56px] w-full bg-surface rounded-lg border-2 border-outline-variant focus:border-primary text-on-surface font-body-lg px-4 outline-none transition-colors" id="receiver-name" placeholder="Ej. Juan Pérez" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="receiver-dni">DNI</label>
<input class="min-h-[56px] w-full bg-surface rounded-lg border-2 border-outline-variant focus:border-primary text-on-surface font-body-lg px-4 outline-none transition-colors" id="receiver-dni" placeholder="Número de documento" type="number"/>
</div>
</div>
<!-- Signature Area -->
<div class="bg-surface-container rounded-xl p-padding-card flex flex-col gap-2">
<div class="flex items-center justify-between">
<h3 class="font-label-caps text-label-caps text-on-surface-variant">Firma de quien recibe</h3>
<button class="text-error font-button-text text-body-md px-2 py-1 active:bg-error-container rounded transition-colors" id="clear-signature" type="button">Borrar firma</button>
</div>
<!-- Signature Pad Placeholder -->
<div class="w-full h-48 bg-surface border-2 border-dashed border-outline-variant rounded-xl flex items-center justify-center relative touch-none overflow-hidden" id="signature-pad-container">
<span class="font-body-lg text-body-lg text-outline absolute pointer-events-none select-none flex items-center gap-2" id="signature-placeholder">
<span class="material-symbols-outlined">draw</span>
                    Firma aquí
                 </span>
<canvas class="w-full h-full absolute inset-0 cursor-crosshair" id="signature-canvas"></canvas>
</div>
</div>
<!-- Photos Section -->
<div class="bg-surface-container rounded-xl p-padding-card flex flex-col gap-4">
<div class="flex items-center justify-between">
<h3 class="font-label-caps text-label-caps text-on-surface-variant">Fotos de la carga (Opcional)</h3>
<span class="font-body-md text-on-surface-variant bg-surface-container-highest px-2 py-1 rounded-full text-sm">0/3</span>
</div>
<div class="grid grid-cols-4 gap-3">
<button class="aspect-square bg-primary-container text-on-primary-container rounded-lg flex flex-col items-center justify-center gap-1 active:bg-primary transition-colors" type="button">
<span class="material-symbols-outlined">photo_camera</span>
</button>
<div class="aspect-square bg-surface border border-outline-variant rounded-lg flex items-center justify-center text-outline-variant border-dashed">
<span class="material-symbols-outlined opacity-50">image</span>
</div>
<div class="aspect-square bg-surface border border-outline-variant rounded-lg flex items-center justify-center text-outline-variant border-dashed">
<span class="material-symbols-outlined opacity-50">image</span>
</div>
<div class="aspect-square bg-surface border border-outline-variant rounded-lg flex items-center justify-center text-outline-variant border-dashed">
<span class="material-symbols-outlined opacity-50">image</span>
</div>
</div>
</div>
<!-- Spacer to push button to bottom if screen is tall enough -->
<div class="flex-grow min-h-[24px]"></div>
<!-- Primary Action -->
<div class="sticky bottom-4 w-full mt-4">
<button class="w-full h-touch-target-primary bg-primary text-on-primary font-button-text text-button-text rounded-xl shadow-lg shadow-black/10 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Guardar entrega
            </button>
</div>
</div>
</div>
<script>
    // Simple Signature Canvas Logic
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('signature-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('signature-pad-container');
        const placeholder = document.getElementById('signature-placeholder');
        const clearBtn = document.getElementById('clear-signature');
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        // Resize canvas to match container
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.strokeStyle = '#1c1b1b'; // on-surface
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }
        
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const { x, y } = getCoordinates(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            lastX = x;
            lastY = y;
            
            placeholder.style.opacity = '0';
        }
        
        function startDrawing(e) {
            isDrawing = true;
            const { x, y } = getCoordinates(e);
            lastX = x;
            lastY = y;
            // Draw dot on click
            ctx.beginPath();
            ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
            placeholder.style.opacity = '0';
        }
        
        function stopDrawing() {
            isDrawing = false;
        }
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);
        
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            placeholder.style.opacity = '1';
        });
    });
</script></main></body></html>
