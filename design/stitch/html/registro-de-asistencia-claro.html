<script>
  // Simple clock script for UI vitality
  function updateTime() {
    const timeElement = document.getElementById('live-time');
    if (!timeElement) return;
    
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    // Set a static initial time as requested, but update it to feel alive
    // In a real app this would sync with a server, here we just show local time for effect
    // timeElement.textContent = `${hours}:${minutes}`;
  }

  // Update dates
  function updateDate() {
      const dateElement = document.getElementById('current-date');
      if (!dateElement) return;
      
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const today = new Date();
      // Capitalize first letter
      let dateString = today.toLocaleDateString('es-ES', options);
      dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
      dateElement.textContent = dateString;
  }

  // Initialize
  updateDate();
  // setInterval(updateTime, 1000); // Optional: uncomment to make time live

  // Interaction script
  const clockInBtn = document.getElementById('clock-in-btn');
  if (clockInBtn) {
    clockInBtn.addEventListener('click', function() {
      const icon = this.querySelector('.material-symbols-outlined');
      const text = this.querySelector('.font-headline-md');
      
      // Visual feedback
      this.classList.add('bg-secondary', 'text-on-secondary');
      this.classList.remove('bg-primary', 'text-on-primary');
      
      const timeSpan = this.querySelector('#live-time');
      timeSpan.classList.add('text-secondary-fixed');
      timeSpan.classList.remove('text-primary-fixed');
      
      icon.textContent = 'check_circle';
      text.textContent = 'Entrada Marcada';
      
      // Vibrate if supported
      if (navigator.vibrate) {
        navigator.vibrate([50, 100, 50]);
      }
      
      // Reset after a moment for demo purposes
      setTimeout(() => {
          this.classList.remove('bg-secondary', 'text-on-secondary');
          this.classList.add('bg-primary', 'text-on-primary');
          
          timeSpan.classList.remove('text-secondary-fixed');
          timeSpan.classList.add('text-primary-fixed');
          
          icon.textContent = 'fingerprint';
          text.textContent = 'Marcar Entrada';
      }, 3000);
    });
  }
