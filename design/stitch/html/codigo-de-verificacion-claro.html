  </head><body class="bg-background text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-screen flex items-center justify-between"><span class="font-headline-md text-headline-md text-on-surface">Mis Viajes</span><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div><div class="px-margin-screen pb-3"><div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-surface-container-high"><span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span><span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Viaje en curso: Ruta Norte</span></div></div></header><main class="flex-1 pt-[112px] pb-[100px] bg-background"><div class="flex flex-col w-full px-margin-screen gap-6 animate-[fadeIn_0.3s_ease-out]">

<input class="w-[50px] h-[64px] rounded-lg bg-surface-container-high text-center font-display-data text-display-data text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-outline-variant" inputmode="numeric" maxlength="1" placeholder="-" type="number"/>
<input class="w-[50px] h-[64px] rounded-lg bg-surface-container-high text-center font-display-data text-display-data text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-outline-variant" inputmode="numeric" maxlength="1" placeholder="-" type="number"/>
<input class="w-[50px] h-[64px] rounded-lg bg-surface-container-high text-center font-display-data text-display-data text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-outline-variant" inputmode="numeric" maxlength="1" placeholder="-" type="number"/>
<input class="w-[50px] h-[64px] rounded-lg bg-surface-container-high text-center font-display-data text-display-data text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-outline-variant" inputmode="numeric" maxlength="1" placeholder="-" type="number"/>

<span class="font-body-md text-body-md" id="timer-text">Puedes pedir otro código en <span class="font-semibold text-primary">0:47</span></span>
</div>
<button class="hidden mt-2 font-button-text text-button-text text-primary py-2 px-4 rounded-lg bg-primary-fixed-dim/20" id="resend-btn">Reenviar código</button>
</div>
<div class="mt-auto pt-8">
<button class="w-full h-touch-target-primary rounded-xl bg-surface-container-highest text-outline font-button-text text-button-text flex items-center justify-center gap-2 transition-all duration-300" disabled="" id="verify-btn">
<span>Verificar</span>
<span class="material-symbols-outlined opacity-0 transition-opacity duration-300" id="verify-icon">arrow_forward</span>
</button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('#otp-container input');
    const verifyBtn = document.getElementById('verify-btn');
    const verifyIcon = document.getElementById('verify-icon');
    const timerText = document.getElementById('timer-text');
    const resendBtn = document.getElementById('resend-btn');
    
    // OTP Input Logic
    inputs.forEach((input, index) => {
      // Restrict to 1 digit
      input.addEventListener('input', (e) => {
        if (e.target.value.length > 1) {
          e.target.value = e.target.value.slice(0, 1);
        }
        
        // Auto-focus next
        if (e.target.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        
        checkComplete();
      });

      // Handle backspace
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
          inputs[index - 1].value = '';
          checkComplete();
        }
      });
      
      // Paste handling
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        
        for (let i = 0; i < pastedData.length; i++) {
          if (inputs[i]) {
            inputs[i].value = pastedData[i];
          }
        }
        
        if (pastedData.length > 0) {
          const focusIndex = Math.min(pastedData.length, 5);
          inputs[focusIndex].focus();
        }
        
        checkComplete();
      });
    });

    function checkComplete() {
      const isComplete = Array.from(inputs).every(input => input.value.length === 1);
      if (isComplete) {
        verifyBtn.disabled = false;
        verifyBtn.classList.remove('bg-surface-container-highest', 'text-outline');
        verifyBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
        verifyIcon.classList.remove('opacity-0');
        
        // Simulate subtle success animation on inputs
        inputs.forEach(input => {
          input.classList.add('ring-2', 'ring-secondary-container', 'bg-secondary-fixed/10');
          setTimeout(() => {
            input.classList.remove('ring-2', 'ring-secondary-container', 'bg-secondary-fixed/10');
          }, 600);
        });
      } else {
        verifyBtn.disabled = true;
        verifyBtn.classList.add('bg-surface-container-highest', 'text-outline');
        verifyBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
        verifyIcon.classList.add('opacity-0');
      }
    }

    // Timer Simulation
    let timeLeft = 47;
    const timerInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerText.parentElement.classList.add('hidden');
        resendBtn.classList.remove('hidden');
        resendBtn.classList.add('animate-[fadeIn_0.3s_ease-out]');
      } else {
        const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
        timerText.innerHTML = `Puedes pedir otro código en <span class="font-semibold text-primary">0:${seconds}</span>`;
      }
    }, 1000);
    
    // Focus first input on load
    setTimeout(() => {
      inputs[0].focus();
    }, 300);
  });
</script>
