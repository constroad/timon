  </head><body class="bg-background text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-screen flex items-center justify-between"><span class="font-headline-md text-headline-md text-on-surface">Mis Viajes</span><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div><div class="px-margin-screen pb-3"><div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-surface-container-high"><span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span><span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Viaje en curso: Ruta Norte</span></div></div></header><main class="flex-1 pt-[112px] pb-[100px] bg-background"><div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
<!-- Amber Status Strip -->
<div class="bg-[#FFF8E1] text-[#F57F17] px-margin-screen py-3 flex items-center gap-2 border-b border-[#FFE082]">
<span class="material-symbols-outlined text-[18px]">wifi_off</span>
<span class="font-body-md text-sm font-medium">Necesitas internet para entrar por primera vez</span>
</div>
<div class="flex flex-col flex-1 px-margin-screen pt-8 pb-10">
<!-- Header -->
<div class="flex flex-col gap-2 mb-10">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Ruta Pro</span>
<h1 class="font-display-data text-display-data text-on-surface">¿De qué empresa eres?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Escribe el código que te dio tu empresa.</p>
</div>
<!-- Input Area -->
<div class="flex flex-col gap-6 w-full mb-auto relative z-10">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant sr-only">Código de empresa</label>
<!-- Pseudo-input layout for monospace groups -->
<div class="flex justify-between items-center gap-2 w-full h-[64px] bg-surface-container-highest rounded-xl px-4 border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<input autocapitalize="characters" autocomplete="off" autocorrect="off" class="w-full bg-transparent border-none outline-none font-mono text-display-data tracking-[0.2em] text-center uppercase text-on-surface placeholder:text-outline" id="code-input" maxlength="14" placeholder="AAAA-BBBB-CCCC" spellcheck="false" type="text"/>
</div>
<div class="flex justify-between items-center px-1 mt-1">
<span class="font-body-md text-sm text-error hidden" id="error-message">Código no válido</span>
</div>
</div>
<button class="flex items-center justify-center gap-2 h-[56px] w-full rounded-xl border border-outline-variant bg-surface text-on-surface font-button-text text-button-text active:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined">qr_code_scanner</span>
                Escanear código QR
            </button>
</div>
<!-- Decorative Element (Subtle Tech Pattern) -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 opacity-5 pointer-events-none z-0">
<svg height="200" viewbox="0 0 100 100" width="200" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="10" id="grid" patternunits="userSpaceOnUse" width="10">
<path d="M 10 0 L 0 0 0 10" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100" width="100"></rect>
</svg>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-6 mt-12 w-full relative z-10">
<button class="flex items-center justify-center h-[64px] w-full rounded-xl bg-surface-container-highest text-on-surface-variant font-button-text text-button-text transition-all duration-300 pointer-events-none" id="btn-continue" type="button">
                Continuar
            </button>
<a class="text-center font-body-md text-primary font-medium active:text-primary-fixed-variant transition-colors" href="#">
                No tengo el código
            </a>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('code-input');
        const btnContinue = document.getElementById('btn-continue');
        
        // Format input as AAAA-BBBB-CCCC
        input.addEventListener('input', function(e) {
            let val = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (val.length > 12) val = val.substring(0, 12);
            
            let formatted = val;
            if (val.length > 4) {
                formatted = val.substring(0, 4) + '-' + val.substring(4);
            }
            if (val.length > 8) {
                formatted = formatted.substring(0, 9) + '-' + val.substring(8);
            }
            
            this.value = formatted;
            
            // Enable button if full code is entered (12 chars + 2 dashes = 14)
            if (formatted.length === 14) {
                btnContinue.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'pointer-events-none');
                btnContinue.classList.add('bg-primary', 'text-on-primary');
                // Optional: trigger a subtle pop animation
                btnContinue.style.transform = 'scale(0.98)';
                setTimeout(() => btnContinue.style.transform = 'scale(1)', 100);
            } else {
                btnContinue.classList.add('bg-surface-container-highest', 'text-on-surface-variant', 'pointer-events-none');
                btnContinue.classList.remove('bg-primary', 'text-on-primary');
            }
        });
        
        // Simulate click
        btnContinue.addEventListener('click', (e) => {
            e.preventDefault();
            btnContinue.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Verificando...';
            btnContinue.classList.add('opacity-90');
        });
    });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-semibold"><div class="flex justify-around items-center h-20 px-4"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-1/2 h-full transition-colors text-primary font-semibold" data-path="mis-viajes" href="#"><span class="material-symbols-outlined">local_shipping</span><span class="font-label-caps text-label-caps">Mis viajes</span></a><a class="flex flex-col items-center justify-center gap-1 w-1/2 h-full text-on-surface-variant transition-colors" data-path="asistencia" href="#"><span class="material-symbols-outlined">support_agent</span><span class="font-label-caps text-label-caps">Asistencia</span></a></div></nav></body></html>
