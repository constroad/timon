</div>
</div>
</div>

<div class="fixed bottom-0 left-0 w-full px-margin-screen py-4 bg-surface/90 backdrop-blur-md pb-safe">
<button class="w-full h-touch-target-primary rounded-xl bg-primary text-on-primary font-button-text text-button-text shadow-md flex items-center justify-center gap-2 disabled:opacity-50 disabled:bg-surface-variant disabled:text-on-surface-variant transition-colors" disabled="" id="btn-submit">
<span class="material-symbols-outlined">check_circle</span>
      Terminar checklist
    </button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const totalItems = 5;
    let completedItems = 0;
    const completedMap = new Map();

    const items = document.querySelectorAll('.checklist-item');
    const counterDisplay = document.getElementById('counter-display');
    const btnSubmit = document.getElementById('btn-submit');

    items.forEach(item => {
      const id = item.dataset.id;
      const btns = item.querySelectorAll('.btn-status');
      const errorNote = item.querySelector('.error-note');

      btns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const status = e.currentTarget.dataset.status;
          
          // Reset styles for both buttons
          btns.forEach(b => {
            b.classList.remove('bg-secondary', 'text-on-secondary', 'bg-error', 'text-on-error', 'border-transparent');
            b.classList.add('bg-surface', 'text-on-surface', 'border-outline');
          });

          // Apply active styles
          if (status === 'bien') {
            e.currentTarget.classList.remove('bg-surface', 'text-on-surface', 'border-outline');
            e.currentTarget.classList.add('bg-secondary', 'text-on-secondary', 'border-transparent');
            errorNote.classList.add('hidden');
          } else {
            e.currentTarget.classList.remove('bg-surface', 'text-on-surface', 'border-outline');
            e.currentTarget.classList.add('bg-error', 'text-on-error', 'border-transparent');
            errorNote.classList.remove('hidden');
          }

          if (!completedMap.has(id)) {
            completedMap.set(id, true);
            completedItems++;
            updateCounter();
          }
        });
      });
    });

    function updateCounter() {
      counterDisplay.textContent = `${completedItems} de ${totalItems}`;
      if (completedItems === totalItems) {
        btnSubmit.disabled = false;
        btnSubmit.classList.add('animate-pulse');
        setTimeout(() => btnSubmit.classList.remove('animate-pulse'), 1000);
      }
    }
  });
</script></main></body></html>
